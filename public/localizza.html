<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADRN Localizzazione</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
      background: #f5f5f5;
    }

    h1 {
      color: #d32f2f;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<h1>ADRN</h1>

<p>
Premi il pulsante per inviare volontariamente
la tua posizione GPS ai soccorritori.
</p>

<button id="send" onclick="sendPosition()">
INVIA POSIZIONE GPS
</button>

<div id="status"></div>

<script>

const MONITORING_DURATION_MS = 15 * 60 * 1000;
let watchId = null;
let started = false;
let bestAccuracy = Infinity;

async function transmit(position) {
  const status = document.getElementById("status");
  const c = position.coords;
  const token = window.location.pathname.split("/").pop();
  bestAccuracy = Math.min(bestAccuracy, c.accuracy || Infinity);
  const response = await fetch("/api/position/" + encodeURIComponent(token), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ lat: c.latitude, lon: c.longitude, accuracy: c.accuracy, altitude: c.altitude, speed: c.speed, heading: c.heading }),
  });
  status.innerHTML = response.ok
    ? `Posizione inviata. Precisione ~${Math.round(c.accuracy || 0)} m.<br>Monitoraggio attivo per 15 minuti: lascia aperta questa pagina.`
    : "Errore invio posizione";
}

function geoError() {
  document.getElementById("status").innerHTML = "Impossibile ottenere la posizione GPS. Verifica il permesso e riprova.";
}

async function sendPosition() {

  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.innerHTML = "Geolocalizzazione non supportata";
    return;
  }

  if (started) return;
  started = true;
  document.getElementById("send").disabled = true;
  status.innerHTML = "Acquisizione GPS...";
  const options = { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 };
  navigator.geolocation.getCurrentPosition(transmit, geoError, options);
  watchId = navigator.geolocation.watchPosition(transmit, geoError, options);
  setTimeout(() => {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    document.getElementById("send").textContent = "MONITORAGGIO COMPLETATO";
    status.innerHTML = `Monitoraggio di 15 minuti completato. Migliore precisione ~${Math.round(bestAccuracy)} m.`;
  }, MONITORING_DURATION_MS);
}

</script>

</body>
</html>
