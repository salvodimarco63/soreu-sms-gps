<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Centrale operativa - Richiesta GPS</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header class="top"><div class="brand"><div class="badge118">118</div><div><h1>Centrale operativa</h1><p class="subtitle">Richiesta volontaria posizione GPS</p></div></div><button class="btn secondary small" onclick="loadList()">Aggiorna</button></header><main class="wrap"><section class="card"><h2>Nuova richiesta</h2><label><b>Nota opzionale</b></label><textarea id="note" placeholder="Esempio: missione, luogo, nominativo o riferimento interno"></textarea><p><button class="btn" onclick="newRequest()">Genera link posizione</button></p><div id="msgBox" class="messageBox hidden"><b>Messaggio da copiare e inviare:</b><pre class="sms" id="sms"></pre><button class="btn secondary small" onclick="copyMsg()">Copia messaggio</button></div><p class="help">Il cittadino deve aprire il link e premere “Consenti” quando il browser chiede la posizione.</p></section><section class="card"><h2>Richieste recenti</h2><table class="table"><thead><tr><th>Ora</th><th>Codice</th><th>Stato</th><th>Posizione</th><th>Azioni</th></tr></thead><tbody id="rows"><tr><td colspan="5">Nessuna richiesta presente.</td></tr></tbody></table><div id="map" class="map"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/centrale.js"></script></body></html>
